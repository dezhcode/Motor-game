name: Build current development APK

on:
  push:
    branches: [codex/development]
    paths:
      - '.github/workflows/development-apk.yml'
      - 'scripts/verify-development-apk.py'
      - 'scripts/tests/test_development_apk.py'
      - 'android/app/src/main/res/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    if: github.ref == 'refs/heads/codex/development'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout the development game
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked web dependencies
        run: npm ci

      - name: Verify game and APK packaging checks
        run: |
          npm run typecheck
          npm run test:physics
          python3 -m unittest discover -s scripts/tests -v

      - name: Build current offline game
        run: |
          npm run build:apk
          cmp src/effects/assets/dunes-at-dusk.m4a dist/assets/audio/dunes-at-dusk.m4a
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/build-info.json', JSON.stringify({
            commit: process.env.GITHUB_SHA,
            branch: process.env.GITHUB_REF_NAME,
            run: process.env.GITHUB_RUN_NUMBER,
            type: 'development-apk',
            builtAt: new Date().toISOString()
          }, null, 2));
          JS
          npx cap sync android
          git diff --exit-code -- app/

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Restore test signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kavirsavar-studio-debug-signing-v1

      - name: Prepare test signing identity
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build the Capacitor development app
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if gradle -p android --no-daemon --max-workers=2 :app:assembleDebug 2>&1 | tee /tmp/kavirsavar-gradle.log; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ] || ! rg -q '429|Too Many Requests|Read timed out|Connection reset' /tmp/kavirsavar-gradle.log; then
              exit 1
            fi
            echo "Temporary dependency download failure; retrying after backoff."
            sleep $((attempt * 30))
          done

      - name: Verify and package the APK
        run: |
          mkdir -p apk
          name="KavirSavar-1.4-test-${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk/$name"
          python3 scripts/verify-development-apk.py --apk "apk/$name" --report apk/WEB-BUNDLE.json
          python3 - "apk/$name" <<'PY'
          import struct, sys
          from zipfile import ZipFile
          with ZipFile(sys.argv[1]) as archive:
              paths = [n for n in archive.namelist() if n.startswith('res/') and n.endswith('/kavirsavar_launcher_art_v1.png')]
              if len(paths) != 1:
                  raise SystemExit('New launcher artwork missing from APK')
              data = archive.read(paths[0])
              if data[:8] != b'\x89PNG\r\n\x1a\n' or struct.unpack('>II', data[16:24]) != (512, 512):
                  raise SystemExit('Unexpected launcher art format or size')
              print('Verified new 512x512 launcher artwork:', paths[0])
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "apk/$name" > apk/SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "apk/$name" > apk/ANDROID-INFO.txt
          python3 - <<'PY'
          from pathlib import Path
          info = Path('apk/ANDROID-INFO.txt').read_text()
          assert "package: name='com.aistudio.kavirsavar.qmxzpk.test'" in info, 'Test package must install separately from the previous game'
          assert "launchable-activity: name='com.aistudio.kavirsavar.qmxzpk.MainActivity'" in info, 'Native launcher must resolve to the existing activity namespace'
          print('Verified isolated test package and launchable native activity')
          PY
          (cd apk && sha256sum "$name" > SHA256SUMS.txt)

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: kavirsavar-development-apk-${{ github.run_number }}
          path: apk/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish test APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="development-apk-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          cat > /tmp/kavirsavar-development-notes.md <<EOF
          KavirSavar 1.4: the garage now shows one large vehicle preview, switches vehicles with the category tabs and arrows, and displays a redesigned nine-slice specifications panel with numeric ratings, ownership status and purchase balance.

          Source branch: codex/development
          Source commit: ${GITHUB_SHA}
          Native wrapper: android/ (Capacitor)
          Offline game: rebuilt dist/ verified byte-for-byte inside the APK.
          Debug-signed for Android phone testing.

          Installs separately as KavirSavar Test (com.aistudio.kavirsavar.qmxzpk.test), so testing does not require uninstalling the previous game or deleting its local progress.

          This is the development game, separate from the original Google Studio main APK. The Studio app/ project is unchanged.
          EOF
          gh release create "$tag" apk/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "KavirSavar 1.4 - Standalone Android test APK ${GITHUB_RUN_NUMBER}" --notes-file /tmp/kavirsavar-development-notes.md --prerelease --latest=false
