name: Build Android Debug APK (KavirSavar)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript check & physics tests
        run: |
          npm run typecheck
          npm run test:physics

      - name: Build Vite web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare test APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/KavirSavar-v0.1.0-test.apk
          sha256sum apk/KavirSavar-v0.1.0-test.apk > apk/SHA256SUMS.txt

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kavirsavar-debug-apk
          path: apk/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish downloadable test APK
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="test-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          cat > /tmp/kavirsavar-release-notes.md <<'EOF'
          Experimental Android test build of KavirSavar.

          Download and install KavirSavar-v0.1.0-test.apk on an Android phone. This is a debug-signed build for testing, not a production release.

          The web build, TypeScript checks, and physics tests run before APK creation. Gameplay and performance still need testing on a physical phone.
          EOF
          gh release create "$tag" apk/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "KavirSavar v0.1.0 - Test ${GITHUB_RUN_NUMBER}" --notes-file /tmp/kavirsavar-release-notes.md --prerelease --latest=false
