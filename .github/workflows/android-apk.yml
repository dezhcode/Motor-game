name: Build exact Google Studio APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: studio-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout the pushed Studio version
        uses: actions/checkout@v4

      - name: Verify packaging checks and snapshot original Studio export
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/verify-studio-apk.py snapshot

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup the Studio Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Read the original Studio Gradle version
        id: gradle-version
        shell: python
        run: |
          import os, pathlib, re
          source = pathlib.Path('gradle/wrapper/gradle-wrapper.properties').read_text()
          version = re.search(r'gradle-([0-9.]+)-(?:bin|all)\.zip', source).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\n')

      - name: Setup Gradle with dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle-version.outputs.version }}

      - name: Restore test signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kavirsavar-studio-debug-signing-v1

      - name: Prepare the Studio test keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          cp "$HOME/.android/debug.keystore" debug.keystore

      # Deliberately build the ORIGINAL app/ project and its committed web export.
      # Do not run Vite, npm build, sync-root-assets, or cap sync: they replace Studio's files.
      - name: Build original Studio Android app
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon --refresh-dependencies :app:assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done

      - name: Verify APK contains exactly the Studio game files
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/KavirSavar-v0.1.0-test.apk
          python3 scripts/verify-studio-apk.py verify --apk apk/KavirSavar-v0.1.0-test.apk
          cd apk
          sha256sum KavirSavar-v0.1.0-test.apk > SHA256SUMS.txt

      - name: Upload verified Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: kavirsavar-studio-apk-${{ github.run_number }}
          path: apk/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish downloadable Studio APK
        if: github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="studio-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          cat > /tmp/kavirsavar-release-notes.md <<EOF
          Android test build from the original Google Studio app project.

          Source commit: ${GITHUB_SHA}
          Game export: app/src/main/assets/public
          Every packaged game file has been checked byte-for-byte against the Studio export. See STUDIO-BUNDLE.json for SHA-256 hashes.
          This workflow does not rebuild or replace the game with Vite or Capacitor.

          Debug-signed APK for phone testing.
          EOF
          gh release create "$tag" apk/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "KavirSavar - Google Studio build ${GITHUB_RUN_NUMBER}" --notes-file /tmp/kavirsavar-release-notes.md --prerelease --latest=false
